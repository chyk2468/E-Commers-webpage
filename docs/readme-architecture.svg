<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">STORE. E-commerce workflow</title><desc id="desc">A React and TypeScript storefront renders product data, lets users filter categories, and updates cart state through the interface.</desc><rect width="1200" height="400" rx="18" fill="#F7F6F3"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#AA3BFF">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#171717">STORE. E-commerce</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6C6C6C">Browse products, filter, and manage a cart</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#DEDEDA"/><path d="M 300 237 L 330 237" stroke="#6C6C6C" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6C6C6C" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6C6C6C" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6C6C6C" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6C6C6C" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6C6C6C" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DEDEDA" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#AA3BFF"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#AA3BFF">01 / CATALOG</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#171717">Product data</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C6C6C">Read the typed product list.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DEDEDA" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#08060D"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#08060D">02 / BROWSE</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#171717">Filter categories</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C6C6C">Render matching product cards.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DEDEDA" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#8E8797"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8E8797">03 / CART</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#171717">Update selection</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C6C6C">Track items and cart count.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DEDEDA" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#AA3BFF"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#AA3BFF">04 / STOREFRONT</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#171717">Responsive UI</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C6C6C">Show products and cart state.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#AA3BFF">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C6C6C">The repository documents a frontend storefront; a checkout or payment backend is not implied.</text></svg>